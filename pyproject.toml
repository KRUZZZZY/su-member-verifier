[project]
name = "su-member-verifier"
version = "1.0.0"
description = "Discord membership verification bot for Swansea Uni societies — scrapes MSL SU member list, cross-references CSV submissions, assigns Discord roles"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.45",
    "httpx>=0.27",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
su-verify = "su_verifier.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.0",
]
sheets = [
    "gspread>=6.1",
    "oauth2client>=4.1",
]
